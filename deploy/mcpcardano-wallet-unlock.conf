# The unlock bound to this machine (decision 132), optional and only with a
# TPM2. systemd decrypts the key of the machine with the TPM2 and the host's
# key and hands it to the wallet, which starts unlocked once an unlock with
# the password has bound its key store to it. Without this file, the wallet
# waits for the password at each start. Install it as
# /etc/systemd/system/mcpcardano-wallet.service.d/unlock.conf after creating
# the credential (see deploy/README.md).
[Service]
LoadCredentialEncrypted=unlock:/etc/credstore.encrypted/mcpcardano-wallet.unlock
