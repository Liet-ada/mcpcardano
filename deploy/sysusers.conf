# The users of the two services and the group of their sockets and their
# configuration (section 10.1), for systemd-sysusers. The person joins the
# group too:
#   usermod -aG mcpcardano <user>
g mcpcardano        -
u mcpcardano-wallet - "mcpcardano wallet" -
u mcpcardano-server - "mcpcardano server" -
m mcpcardano-wallet mcpcardano
m mcpcardano-server mcpcardano
